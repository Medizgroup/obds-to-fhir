services:
  obds-to-fhir:
    restart: "no"
    user: "${USER_ID:-65532}:${GROUP_ID:-65532}"
    environment:
      SPRING_PROFILES_ACTIVE: "mappings,process-from-directory"
      # -- if true, a file with a non-conformant or unmappable Meldung is logged and skipped
      # instead of aborting the whole directory run. See docs/config.md for details and caveats.
      OBDS_PROCESS_FROM_DIRECTORY_ON_ERROR_SKIP_INVALID_MESSAGES: "${SKIP_INVALID_MESSAGES:-false}"
      OBDS_PROCESS_FROM_DIRECTORY_ON_ERROR_FAILED_DIRECTORY: "/opt/obds-to-fhir/failed"

      # DIZ Gießen: FHIR system identifiers
      FHIR_SYSTEMS_IDENTIFIERS_BASE_URL: "http://ukgm.de/fhir/NameSpace"
      FHIR_SYSTEMS_IDENTIFIERS_PATIENT_ID: "http://ukgm.de/fhir/NameSpace/Global/PatId/pseudonymized"

      # DIZ Gießen: Patient reference generation via FHIR_SERVER_LOOKUP
      FHIR_MAPPINGS_CREATE_PATIENT_RESOURCES_ENABLED: "true"
      FHIR_MAPPINGS_PATIENT_REFERENCE_GENERATION_STRATEGY: "FHIR_SERVER_LOOKUP"
      # TODO: an welchen FHIR-Server soll das?.
      FHIR_MAPPINGS_PATIENT_REFERENCE_GENERATION_FHIR_SERVER_BASE_URL: "http://ugisrdiztest.ugi.rka.local/fhir"
      FHIR_MAPPINGS_PATIENT_REFERENCE_GENERATION_FHIR_SERVER_AUTH_BASIC_ENABLED: "true"
      # ENV_USERNAME / ENV_PASSWORD come from deploy/.env
      FHIR_MAPPINGS_PATIENT_REFERENCE_GENERATION_FHIR_SERVER_AUTH_BASIC_USERNAME: "${ENV_USERNAME}"
      FHIR_MAPPINGS_PATIENT_REFERENCE_GENERATION_FHIR_SERVER_AUTH_BASIC_PASSWORD: "${ENV_PASSWORD}"
    volumes:
      - type: bind
        source: ${INPUT_DIRECTORY:?}
        target: /opt/obds-to-fhir/obds-input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OUTPUT_DIRECTORY:?}
        target: /opt/obds-to-fhir/fhir-output
        bind:
          create_host_path: false
      - type: bind
        source: ${FAILED_DIRECTORY:-./failed}
        target: /opt/obds-to-fhir/failed
        bind:
          create_host_path: true
